[build-system]
requires = ["hatchling", "pegen>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "Quantar"
description = "A Python superset for easy quantum computing, operator creation and physics simulations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "numpy",
    "numba",
    "openqasm3[parser]",
    "pegen>=0.3.0",
]

[project.optional-dependencies]
backends = [
    "pennylane",
    "qiskit",
    "qbraid",
    "qiskit-aer",
]
optimization = ["scipy"]
lsp = ["pygls", "lsprotocol"]

[tool.hatch.version]
path = "__init__.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["quantum", "stl", "lang_systems"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/hatch_build.py",
    "/__init__.py",
    "/quantum",
    "/stl",
    "/lang_systems",
    "/Grammar/python.gram",
    "/Grammar/python_clean.gram",
]

[project.scripts]
qtr = "lang_systems.runner:runner"
